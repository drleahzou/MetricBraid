# MetricBraid device registry — USER CONFIGURATION
# ---------------------------------------------------------------------------
# This is the configuration layer. The framework lives in CLAUDE.md (routing
# rules) and spec/ (the routed-observation contract); the empirical layer lives
# in evidence/. Those three name no hardware. THIS file is where hardware is
# named, and it is the only one most people ever edit.
#
# The routing rules are written against CAPABILITY CLASSES, not brands. Declare
# which devices you own and which classes each one provides, and the rules
# follow your setup — you should not need to edit CLAUDE.md itself.
#
# CAPABILITY CLASSES
#   passive_247      Worn continuously, measures passively (sleep, resting HR,
#                    HRV, temperature, recovery scores).            -> Rule A
#   recorded_workout Sessions you deliberately start recording.     -> Rule B
#   auto_detected    Activity the device notices on its own.        -> Rule C
#
# A device may declare several. The RECORD carries the class, not the device:
# an auto-detected walk from a device that also does passive_247 still routes
# through Rule C.
#
# HR SENSOR CLASSES (see evidence/general/hr-sensor-placement.md)
#   ecg_chest_strap  Electrical, chest.        Highest trust.
#   optical_armband  Optical, upper arm/forearm. High trust.
#   wrist_optical    Optical, wrist.          Low trust during exercise.
#   ring_ppg         Optical, finger.         Unknown during exercise.
#   other_ble        Earbuds, gym equipment.  Unknown — treated as undeclared.
#
# IMPORTANT: entries below declare CAPABILITIES (how a device is worn, what it
# records) — these are checkable facts. They do NOT confer accuracy claims.
# Accuracy comes only from a dossier in evidence/. A device with no dossier
# inherits the device-agnostic baselines in evidence/general/ and nothing more.
# ---------------------------------------------------------------------------

devices:
  - name: Oura Ring
    id: oura
    mcp_server: oura
    capabilities: [passive_247, auto_detected, recorded_workout]
    hr_sensor: ring_ppg
    notes: >-
      recorded_workout since Live Activity Tracking (2026-06-04, Gen3+), which
      records sessions and pairs external BLE HR monitors. The ring does not
      stream live HR without an external monitor paired.
    evidence: evidence/devices/oura.md

  - name: Garmin Forerunner 955
    id: garmin
    mcp_server: garmin
    capabilities: [recorded_workout, auto_detected, passive_247]
    hr_sensor: wrist_optical
    notes: >-
      Generates running dynamics from the wrist, so the presence of ground
      contact time or vertical oscillation is NOT evidence a strap was worn.
    evidence: evidence/devices/garmin.md

# ---------------------------------------------------------------------------
# EXTERNAL HR MONITORS
# No API reports which sensor fed a session, so this must be declared.
# Undeclared activity types are treated as UNMONITORED for confidence purposes
# — the rules will flag the HR as low-confidence rather than assume.
# ---------------------------------------------------------------------------
external_hr_monitors:
  owned:
    - name: Garmin HRM 200
      class: ecg_chest_strap
      pairs_with: [garmin, oura]   # any BLE HR Service device pairs with both

  worn_for:
    # Declared by the user 2026-08-30. No API reports the HR sensor, so this
    # is the source of truth for which sessions have strap-grade HR.
    ecg_chest_strap:
      - strengthTraining
      - strength_training
      - indoor_cardio
      - cardio
      - running
      - treadmill_running
      - cycling
      - indoor_cycling
    none:
      - yoga
      - stretching
      - pilates
      - swimming        # the HRM 200 is not a swimming strap. Separately,
                        # BLE/ANT+ does not transmit through water at all —
                        # live HR would need onboard store-and-forward on the
                        # monitor itself.
    unknown: []         # anything not listed above is treated as `none`
                        # for confidence purposes — flag, don't assume.

# ---------------------------------------------------------------------------
# KNOWN DATA-SOURCE DEFECTS
# Bugs in a provider's API or MCP server that silently corrupt analysis.
# Check this list before trusting a tool's output.
# ---------------------------------------------------------------------------
known_defects:
  - source: oura
    tool: get_heart_rate
    observed: 2026-08-30
    severity: high
    problem: >-
      Ignores the date range. Requests for 2026-08-19, 2026-08-29 and
      2026-07-02 each returned a byte-identical summary (1000 readings,
      avg 78 bpm, range 50-180, awake 42 / rest 107 / workout 851). It
      appears to return a single fixed window regardless of the dates asked
      for.
    consequence: >-
      Any per-day heart-rate claim sourced from this tool is unreliable, and
      any Oura-vs-other-device HR comparison is currently impossible. The
      failure is silent — it returns plausible-looking data, not an error.
    root_cause: >-
      src/client.ts getHeartRate() sends start_date/end_date, but the Oura
      /v2/usercollection/heartrate endpoint takes start_datetime/end_datetime
      (ISO 8601). Oura discards the unrecognized params and returns a default
      window. Compounded by the client having no pagination (next_token is
      declared but never consumed), so results also truncate at one page.
    reported: https://github.com/mitchhankins01/oura-ring-mcp/issues/12
    until_fixed: >-
      Do not use get_heart_rate for date-specific analysis. Say the data is
      unavailable rather than reporting the returned numbers.

  - source: oura
    tool: get_workouts
    observed: 2026-08-28
    severity: medium
    problem: >-
      Can return the same bout multiple times with slightly different
      calorie values (one walking bout appeared 3x: 56 / 56 / 55.746 kcal).
    consequence: Inflates daily totals if not deduplicated within-source.
    until_fixed: Run the intra-source dedup step in CLAUDE.md first.

# ---------------------------------------------------------------------------
# TIEBREAKS — used when two devices declare the same capability class.
# See CLAUDE.md "MULTIPLE DEVICES, SAME CLASS".
#
# A tiebreak is USER PREFERENCE, not evidence. It resolves ROUTING (which
# source gets reported) and buys exactly nothing for MEASUREMENT CONFIDENCE
# (whether that source's number is any good) — no study orders one 24/7
# wearable against another. The routing basis becomes `user_preference`, and
# the assistant is required to say a preference decided the answer and to keep
# the other device's value visible alongside it.
#
# Leave one `null` or unset and the conflict is reported as UNRESOLVED, with
# both values and their provenance. That is a valid choice, not a gap.
# ---------------------------------------------------------------------------
tiebreaks:
  passive_247: oura        # which device is reported for sleep / HRV / resting HR
  recorded_workout: garmin # which owns the EVENT channel when BOTH devices
                           # recorded the same session. Never the HR channel —
                           # that routes by sensor class (Rule B).
  auto_detected: null      # null = whichever device detected it (Rule C)

